# Render Blueprint for the Waytokaaba API (free plan).
# Render dashboard → New → Blueprint → select this repository.
# Values marked `sync: false` are prompted for during setup — never commit them.
services:
  - type: web
    name: waytokaaba-api
    runtime: docker
    plan: free
    region: singapore # closest free region to Pakistan / Saudi Arabia; change if preferred
    dockerContext: .
    dockerfilePath: ./src/Waytokaaba.API/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Neon connection string, e.g. postgresql://user:pass@ep-xxx.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Random 32+ character secret used to sign admin login tokens (Render generates one).
      - key: Jwt__SigningKey
        generateValue: true
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      # Set to "false" once the client's real hotels/packages are entered.
      - key: Database__SeedDemoData
        value: "true"
      # First admin account (created on startup if it doesn't exist).
      - key: Database__AdminEmail
        sync: false
      - key: Database__AdminPassword
        sync: false
      # Your Vercel URL(s), comma-separated, e.g. https://waytokaaba.vercel.app
      - key: Cors__AllowedOrigins
        sync: false
